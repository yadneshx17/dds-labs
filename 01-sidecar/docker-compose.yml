services:
  inventory:
    build:
      context: .
      dockerfile: ./cmd/inventory/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - inventory-sidecar

  inventory-sidecar:
    build:
      context: .
      dockerfile: ./cmd/sidecar/Dockerfile
    ports:
      - "8083:8888"
    environment:
      - LOG_PATH=logs/2026/service-inventory-log.log
    volumes:
        - ./data/logs:/app/logs

  order:
    build:
      context: .
      dockerfile: ./cmd/order/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - order-sidecar

  order-sidecar:
    build:
      context: .
      dockerfile: ./cmd/sidecar/Dockerfile
    ports:
      - "8084:8888"
    environment:
      - LOG_PATH=logs/2026/service-order-log.log
    volumes:
        - ./data/logs:/app/logs

  payment:
    build:
      context: .
      dockerfile: ./cmd/payment/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - payment-sidecar

  payment-sidecar:
    build:
      context: .
      dockerfile: ./cmd/sidecar/Dockerfile
    ports:
      - "8085:8888"
    environment:
      - LOG_PATH=logs/2026/service-payment-log.log
    volumes:
        - ./data/logs:/app/logs
